server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # HTML, service worker e manifest nunca devem ficar presos em cache longo
    location = /             { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html   { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /economias.json { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Assets estáticos com cache longo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
