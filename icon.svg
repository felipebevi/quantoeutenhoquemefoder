<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo "Quanto eu tenho que me foder" — moeda/relógio R$ em vermelho -->
  <rect width="512" height="512" rx="116" fill="#d61f2b"/>
  <!-- anel externo -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.92"/>
  <!-- marcas de minuto (ticks) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="20" stroke-dasharray="4 21.3" opacity="0.9"/>
  <!-- ponteiro do relógio (para cima) -->
  <path d="M256 252 L247 150 L265 150 Z" fill="#ffffff"/>
  <!-- R$ central -->
  <text x="256" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="158" font-weight="bold" fill="#ffffff" text-anchor="middle">R$</text>
</svg>
