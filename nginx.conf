server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    # HTML, service worker e manifest nunca devem ficar presos em cache longo
    location = /             { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html   { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /economias.json { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SEO: arquivos de descoberta para crawlers
    location = /robots.txt   { add_header Cache-Control "public,max-age=86400"; types{} default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml  { add_header Cache-Control "public,max-age=86400"; types{} default_type application/xml; try_files $uri =404; }

    # Assets estáticos: cache de 1h só (suficiente p/ performance, curto p/ não
    # ficar preso em CDN/Cloudflare ao trocar logos). Cache busting via ?v=YYYYMMDD.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
