<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo "Quanto eu tenho que me foder" — cronômetro: meio relógio + meio cifrão -->
  <!-- Botão de cima -->
  <rect x="230" y="22" width="52" height="34" rx="10" fill="#d61f2b"/>
  <rect x="218" y="50" width="76" height="20" rx="6" fill="#d61f2b"/>
  <!-- Knob lateral direita (acima do anel) -->
  <rect x="378" y="108" width="40" height="14" rx="6" fill="#d61f2b"/>
  <!-- Corpo do cronômetro (anel) -->
  <circle cx="256" cy="296" r="186" fill="none" stroke="#d61f2b" stroke-width="36"/>
  <!-- Divisor vertical (separa relógio do cifrão) -->
  <line x1="256" y1="116" x2="256" y2="476" stroke="#d61f2b" stroke-width="14" stroke-linecap="round"/>
  <!-- Marcas cardinais (apenas onde não cruza o divisor) -->
  <line x1="256" y1="124" x2="256" y2="156" stroke="#d61f2b" stroke-width="14" stroke-linecap="round" opacity="0"/>
  <line x1="86"  y1="296" x2="120" y2="296" stroke="#d61f2b" stroke-width="16" stroke-linecap="round"/>
  <line x1="392" y1="296" x2="426" y2="296" stroke="#d61f2b" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="468" stroke="#d61f2b" stroke-width="14" stroke-linecap="round"/>
  <!-- Ponteiros do relógio (lado esquerdo) -->
  <line x1="256" y1="296" x2="156" y2="296" stroke="#d61f2b" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="296" x2="220" y2="200" stroke="#d61f2b" stroke-width="20" stroke-linecap="round"/>
  <!-- Pivô central -->
  <circle cx="256" cy="296" r="14" fill="#d61f2b"/>
  <!-- Cifrão (lado direito) -->
  <text x="350" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="160" font-weight="900"
        fill="#d61f2b" text-anchor="middle">$</text>
</svg>
